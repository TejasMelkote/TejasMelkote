    <rect x="430" y="165" width="190" height="36" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="450" y="188" fill="#e2e8f0" font-size="14"><tspan fill="#5eead4" font-weight="700">COLM 2026</tspan> poster</text>

    <rect x="636" y="165" width="220" height="36" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="656" y="188" fill="#e2e8f0" font-size="14"><tspan fill="#5eead4" font-weight="700">Live</tspan> users in production</text>
