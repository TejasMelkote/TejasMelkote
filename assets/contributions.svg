<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="2,606+ GitHub contributions">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="24" fill="url(#bg2)"/>
  <rect x="1" y="1" width="1198" height="218" rx="23" fill="none" stroke="#1f2937" stroke-width="2"/>

  <text x="48" y="55" fill="#5eead4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" letter-spacing="3">PROOF OF SHIPPING · NOT A SIDE PROJECT YEAR</text>
  <text x="48" y="120" fill="url(#g)" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="900">2,606+</text>
  <text x="340" y="105" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">GitHub contributions</text>
  <text x="340" y="140" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Combined public activity across personal + work accounts · 100% in shipping phase</text>

  <!-- mini stats -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="48" y="165" width="170" height="36" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="68" y="188" fill="#e2e8f0" font-size="14"><tspan fill="#5eead4" font-weight="700">15+</tspan> production PRs</text>

    <rect x="234" y="165" width="180" height="36" rx="18" fill="#0f172a" stroke="#334155"/>
